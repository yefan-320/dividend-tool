name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 单元测试（含回测差分测试）
        run: node --test test/*.test.js
      - name: 静态检查（index/sw/import/manifest/数据引用）
        run: node tools/check-static.mjs
      - name: 数据体检（覆盖/一致性/新鲜度/引擎自检）
        run: node tools/audit-app.mjs
      - name: 首屏性能预算（数据/JS gzip 体积、懒加载结构）
        run: node tools/check-budget.mjs
      - name: 浏览器冒烟（36 项，本地静态服务 + 无头 Chrome）
        run: |
          mkdir -p ../report/design
          python3 -m http.server 8766 --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          sleep 1
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)
          echo "chrome=$CHROME"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --disable-crash-reporter --remote-debugging-port=9222 --user-data-dir=/tmp/d3-chrome about:blank >/tmp/chrome.log 2>&1 &
          for i in $(seq 1 30); do curl -s --max-time 2 http://127.0.0.1:9222/json/version >/dev/null && break; sleep 1; done
          node tools/smoke-all.mjs
          node tools/check-render-budget.mjs
          node tools/check-xss.mjs
          node tools/check-pwa.mjs
          node tools/check-plan-flow.mjs
